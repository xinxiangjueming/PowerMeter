[versions]
agp = "9.2.1"
kotlin = "2.4.0"
composeBom = "2026.09.00"
# Material 3 Expressive：稳定版 1.4.0 不含 Expressive API，
# Expressive 组件自 1.5.0-alpha19 起可用，这里取最新 alpha
material3 = "1.5.0-alpha27"
graphicsShapes = "1.0.1"
activityCompose = "1.13.0"
coreKtx = "1.18.0"
# 顶栏三档模糊：Haze（API 31–32 真实模糊）+ com.kyant.backdrop（API≥33 渐进式 AGSL 模糊）
haze = "1.7.2"
backdrop = "2.0.1"
# Miuix UI（KMP，MIUI 风格组件）：取与 SportLink 完全一致的 0.9.2，
# 仅用于曲线颜色色盘 ColorPalette（SportLink ui/ColorPickerDialogs.kt 同源实现）
miuix = "0.9.2"
# Shizuku（adb 权限，非 root 机器读取 /sys 电量节点）。版本与 fold 完全一致
shizuku = "13.1.5"
# Room（采样会话落库，私有目录）。⚠️ KSP 版本必须与 Kotlin 对齐：
# 本机 KSP 最新为 2.3.12，但 sportlink 实测可用组合是 Kotlin 2.4.0 + KSP 2.3.9 + Room 2.8.4，
# 直接照搬这套版本（换更高 KSP 需重新验证与 Kotlin 2.4.0 的兼容）
ksp = "2.3.9"
room = "2.8.4"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes-android", version.ref = "graphicsShapes" }
dev-chrisbanes-haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
kyant-backdrop = { group = "io.github.kyant0", name = "backdrop", version.ref = "backdrop" }
yukonga-miuix-ui = { group = "top.yukonga.miuix.kmp", name = "miuix-ui", version.ref = "miuix" }
dev-rikka-shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
dev-rikka-shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
